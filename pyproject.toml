[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decomb"
version = "0.1.0"
description = "Audited removal of narrowband line and comb artifacts from continuous EEG"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Joshua Duquette" }]
keywords = ["eeg", "bids", "mne", "line noise", "harmonics", "artifact removal"]
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "mne>=1.6",
    "mne-bids>=0.14",
    "numpy>=1.24",
    "pandas>=2.0",
    "pybv>=0.7.5",
    "pyyaml>=6.0",
    "scipy>=1.11",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
decomb = "decomb.cli:main"

[project.urls]
Homepage = "https://github.com/JoshuaDuq/decomb"
Issues = "https://github.com/JoshuaDuq/decomb/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decomb = ["defaults.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# zip(..., strict=True) is the better default, but turning it on across the numerical
# code would convert a silently-truncating length mismatch into a mid-run exception on
# a user's data. That is a behaviour change, and it belongs in a change that can be
# validated against real recordings rather than in a lint sweep.
ignore = ["B905"]
